<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Materiais de cidadania dinamarquesa</title>
  <style>
    :root { --ink: #18212a; --muted: #5f6b76; --paper: #fffdfa; --brand: #8c2430; --line: #e7dfd5; --soft: #f5eee6; --shadow: 0 12px 34px rgba(45,32,24,.10); }
    * { box-sizing: border-box; }
    body { margin: 0; background: #eee9e2; color: var(--ink); font: 17px/1.65 system-ui, sans-serif; }
    main { max-width: 900px; min-height: 80vh; margin: 3rem auto; padding: clamp(1.5rem, 5vw, 4rem); background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .eyebrow { color: var(--brand); font: 700 .75rem system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: .4rem 0 2rem; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.1; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
    .card { display: block; padding: 1.4rem; color: var(--ink); text-decoration: none; background: white; border: 1px solid var(--line); box-shadow: var(--shadow); }
    .card:hover { border-color: #caa56b; transform: translateY(-2px); }
    .card strong { display: block; color: var(--brand); font: 700 1rem system-ui, sans-serif; }
    .card span { display: block; margin-top: .55rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Materiais de estudo</div>
    <h1>Provas de cidadania dinamarquesa</h1>
    <div class="cards">
      <a class="card" href="indfodsretsproven/index.html">
        <strong>Indfødsretsprøven</strong>
        <span>Material de estudo e espaço reservado para futuras provas.</span>
      </a>
      <a class="card" href="medborgerskabsproeven/index.html">
        <strong>Medborgerskabsprøven</strong>
        <span>Material de estudo, provas anteriores e simulados.</span>
      </a>
    </div>
  </main>
</body>
</html>
